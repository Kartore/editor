# @kartore/editor の CI: 型チェック・lint・テスト・ビルド (プリセットと playground の Cloudflare / Node)。
# 注意: pnpm-workspace.yaml に `pnpm link` の overrides (link:../…) が残っていると frozen install が失敗する。
# playground は npm に出ている @kartore/file-adapter (^0.8.0) を使う
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # package.json の devEngines (26.5.0) と合わせる。npm は devEngines が一致しないと止まる
          node-version: 26.5.0

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Install pnpm
        run: corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build (kartore() preset)
        run: pnpm build

      # 最初のリリースの間は playground を workspace から外している (pnpm-workspace.yaml)。
      # @kartore/file-adapter 0.8.0 の publish 後に戻し、playground の build もここに戻す
